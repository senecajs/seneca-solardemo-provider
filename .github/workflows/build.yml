# This workflow builds the plugin and runs its tests.
#
# The Solardemo SDK is a normal published dependency, so `npm install` is all
# that is needed to build and run the offline tests on every platform.
#
# The live tests additionally need the companion Solardemo server, which is
# only distributed in the SDK's source repository (it is not published). That
# repo is cloned and started on Linux only, because backgrounding the server
# assumes a POSIX shell. The live tests probe for the server and skip cleanly
# when it is absent, so on Windows and macOS they simply skip.

name: build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    timeout-minutes: 10

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node-version: [24.x]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}

      # Live-test target. Failure to start degrades coverage (the live tests
      # skip) rather than failing the build.
      - name: Start the Solardemo test server
        if: runner.os == 'Linux'
        run: |
          git clone --depth 1 \
            https://github.com/voxgig-sdk/voxgig-solardemo-sdk.git \
            "$RUNNER_TEMP/solardemo-sdk"
          cd "$RUNNER_TEMP/solardemo-sdk/app"
          npm install
          npm run build
          npm start &
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8901/api/planet > /dev/null; then
              echo "server up"
              exit 0
            fi
            sleep 1
          done
          echo "server did not start; live tests will skip"

      - run: npm install
      - run: npm i seneca seneca-entity seneca-promisify @seneca/provider @seneca/env
      - run: npm run build --if-present
      - run: npm test
